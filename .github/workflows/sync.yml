name: Synchronisation Brawl Stars

on:
  schedule:
    # Trophées : toutes les heures (UTC). Ranked : toutes les 6 heures.
    - cron: '7 * * * *'
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = trophées, ranked = ranked, probe = test'
        type: choice
        options:
          - sync
          - ranked
          - probe
        default: sync

concurrency:
  group: brawl-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Lancer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
          MODE_INPUT: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$MODE_INPUT"
          if [ -z "$MODE" ]; then
            if [ "$SCHEDULE" = "37 */6 * * *" ]; then MODE=ranked; else MODE=sync; fi
          fi
          echo "Mode : $MODE"
          node scripts/$MODE.mjs
